[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5emu"
version = "0.9.4"
description = "Playstation 5 Emulator — experimental PS5 host for Windows"
requires-python = ">=3.10"
dependencies = ["PySide6==6.7.2", "tomli==2.0.1; python_version < '3.11'"]

[project.scripts]
ps5emu = "ps5emu_app.main:main"

[tool.setuptools.packages.find]
include = ["ps5emu_*", "extensions*"]